name: Divinity Planner tests

on:
  push:
    branches:
      - main
      - fix/god-rank-attempt-outcomes
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
